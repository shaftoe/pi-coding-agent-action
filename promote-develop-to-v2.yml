name: Promote develop to v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward v2 to develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v2

      - name: Ensure v2 is not ahead of develop
        run: |
          git fetch origin develop
          # Check that develop is a descendant of v2 (ff-only possible)
          if ! git merge-base --is-ancestor origin/v2 origin/develop; then
            echo "::error::v2 has commits not in develop. Cannot fast-forward. Rebase or manual resolution required."
            exit 1
          fi

      - name: Fast-forward merge
        run: |
          git merge --ff-only origin/develop

      - name: Push v2
        run: |
          git push origin v2
