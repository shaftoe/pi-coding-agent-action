name: Release Tools Package

on:
  push:
    branches:
      - v2
    paths:
      - 'packages/pi-tools/**'
      - 'tests/pi/tools/**'
      - '.github/workflows/release-tools.yml'

permissions:
  id-token: write
  contents: write

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (subpackage)
        working-directory: packages/pi-tools
        run: bun run type-check

      - name: Format check (subpackage)
        working-directory: packages/pi-tools
        run: bun run format

      - name: Test (subpackage)
        run: bun test packages/pi-tools/tests/

      - name: Test (integration)
        run: bun test tests/pi/tools/

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/pi-tools
        run: bun run build

      - name: Verify npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: packages/pi-tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
