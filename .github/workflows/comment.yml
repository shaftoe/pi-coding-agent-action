name: Pi AI Agent

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi-agent:
    uses: ./.github/workflows/pi.yml
    with:
      allowed_actor: shaftoe
    secrets:
      gh_token: ${{ secrets.GH_PAT }} # Has Gists write access
      token: ${{ secrets.API_KEY }}
      opengist_token: ${{ secrets.OPENGIST_TOKEN }}
