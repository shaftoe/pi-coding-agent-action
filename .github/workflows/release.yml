name: Release

on:
  push:
    branches:
      - v2
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  test-and-coverage:
    uses: ./.github/workflows/build_test_coverage.yml
    with:
      e2e: true
    secrets:
      token: ${{ secrets.API_KEY }}
      token_custom: ${{ secrets.API_KEY_CUSTOM }}

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: test-and-coverage
    env:
      # All builds in this job are release builds — the dist must contain a
      # bare semver, never a `-dev+branch.sha` suffix.
      RELEASE_BUILD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
