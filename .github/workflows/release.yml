name: Release

# Gates on the full test+e2e suite, then runs semantic-release. After a release
# is cut, the release commit (version bump, clean dist, CHANGELOG) is merged
# back into `develop` with `git merge --ff-only` so `develop` and `v2` stay equal.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  test-and-coverage:
    uses: ./.github/workflows/build_test_coverage.yml
    with:
      e2e: true
    secrets:
      token: ${{ secrets.API_KEY }}
      token_custom: ${{ secrets.API_KEY_CUSTOM }}

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v2
          fetch-depth: 0

      - name: Ensure v2 branch is active
        run: git checkout -B v2 origin/v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge release commit back to develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop v2
          git checkout -B develop origin/develop
          if git merge --ff-only origin/v2; then
            git push origin develop
            echo "Merged release commit back into develop ✓"
          else
            echo "::warning::develop is not a fast-forward of v2; skipping merge-back (manual sync needed)"
          fi
