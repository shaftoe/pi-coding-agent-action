name: Package dist

on:
  push:
    branches:
      - develop
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

permissions:
  contents: write

concurrency:
  group: package-dist
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist
        run: bun run package

      - name: Update dependency versions in README
        run: bun run update-readme

      - name: Check for changes
        id: check_changes
        run: |
          # Force-add dist/ (which is gitignored) to staging, then compare against HEAD.
          # This correctly detects changes even when dist/ is not tracked in git.
          git add -f dist/
          if git diff --cached --exit-code -- dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset -- dist/ > /dev/null 2>&1 || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "chore: update dist [skip ci]"
          git pull --rebase origin develop --autostash
          git push origin develop
