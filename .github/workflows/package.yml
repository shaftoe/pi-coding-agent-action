name: Package dist

on:
  push:
    branches:
      - develop
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-dist
  cancel-in-progress: false

jobs:
  rebuild-dist:
    uses: ./.github/workflows/rebuild-dist.yml
    with:
      commit-message: 'chore: update dist and README deps [skip ci]'
    secrets: inherit

  update-readme:
    needs: rebuild-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Update dependency versions in README
        run: bun run update-readme

      - name: Check for changes
        id: check_changes
        run: |
          git add -f README.md
          if git diff --cached --exit-code -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset -- README.md > /dev/null 2>&1 || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "chore: update README deps [skip ci]"
          git pull --rebase origin develop --autostash
          git push origin develop
