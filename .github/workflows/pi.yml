name: Pi AI Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi-agent:
    # Only run when comment contains trigger
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/pi')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@pi-bot'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Pi Coding Agent
        run: bun install @mariozechner/pi-coding-agent

      - name: Run pi agent
        uses: shaftoe/pi-coding-agent-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: zai
          model: glm-4.7
          env_vars: |
            ZAI_API_KEY=${{ secrets.ZAI_API_KEY }}
