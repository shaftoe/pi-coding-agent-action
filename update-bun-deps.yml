name: Update Bun Dependencies

# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: uses the Pi coding agent to update bun dependencies and
# open a PR with the changes.
#
# NOTE: This file lives at the repository root because the CI token cannot
# push to .github/workflows/. Move to .github/workflows/ on merge to use as
# a reusable workflow from external repos.
#
# USAGE – from any bun-based repository:
#
#   jobs:
#     update-deps:
#       uses: shaftoe/pi-coding-agent-action/.github/workflows/update-bun-deps.yml@v2
#       with:
#         provider: anthropic
#         model: claude-sonnet-4-5
#         extra-prompt: "Run bun run validate and bun test after updating"
#       secrets:
#         token: ${{ secrets.API_KEY }}
#         github_token: ${{ secrets.GITHUB_TOKEN }}
#
# The workflow can also be dispatched manually from the Actions tab.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      provider:
        description: "LLM provider (e.g. anthropic, openai, google)."
        required: true
        type: string

      model:
        description: "Model to use (e.g. claude-sonnet-4-5, gpt-4o, gemini-2.5-pro)."
        required: true
        type: string

      thinking_level:
        description: "Thinking level for the agent (off, low, medium, high)."
        required: false
        type: string
        default: "off"

      package-json-path:
        description: "Path to the package.json directory to update (e.g. '.' for root, 'site' for a subdirectory)."
        required: false
        type: string
        default: "."

      extra-prompt:
        description: "Additional instructions for the agent (e.g. 'run bun run validate and bun test after updating')."
        required: false
        type: string
        default: ""

      bun-version:
        description: "Bun version to install."
        required: false
        type: string
        default: "latest"

      base-url:
        description: "Optional override for the provider base URL."
        required: false
        type: string
        default: ""

    secrets:
      token:
        description: "API token for the LLM provider."
        required: true

      github_token:
        description: "GitHub token for the Pi agent. Falls back to the automatic GITHUB_TOKEN when not provided."
        required: false

  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider."
        required: true
        type: string
      model:
        description: "Model to use."
        required: true
        type: string
      thinking_level:
        description: "Thinking level (off, low, medium, high)."
        required: false
        type: string
        default: "off"
      package-json-path:
        description: "Path to package.json directory ('.' for root, or a subdirectory)."
        required: false
        type: string
        default: "."
      extra-prompt:
        description: "Extra instructions for the agent."
        required: false
        type: string
        default: ""
      bun-version:
        description: "Bun version."
        required: false
        type: string
        default: "latest"
      base-url:
        description: "Optional provider base URL override."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ inputs.bun-version || 'latest' }}"

      - name: Build prompt
        id: prompt
        env:
          PKG_PATH: "${{ inputs.package-json-path || '.' }}"
          EXTRA: "${{ inputs.extra-prompt }}"
        run: |
          # Normalize path display for the prompt
          if [ "$PKG_PATH" = "." ]; then
            PKG_DISPLAY="the repository root"
          else
            PKG_DISPLAY="'$PKG_PATH'"
          fi

          # Compose the agent prompt
          cat <<PROMPT_EOF > /tmp/prompt.txt
          You are a dependency update bot. Your task is to update all bun dependencies to their latest versions and create a pull request with the changes.

          ## Steps

          1. Run `bun outdated` in $PKG_DISPLAY to see which packages have available updates.
          2. For each outdated package, update it to the latest version by running `bun update <package-name>` (one at a time or in batches). Do NOT use the `--latest` flag — instead update each package individually so that package.json ranges are respected naturally.
          3. After updating, verify the lockfile is consistent by running `bun install`.
          4. Review the actual changes to package.json and bun.lock to confirm what was updated.
          5. Create a pull request titled `chore(deps): update bun dependencies` with a clear summary of which packages were updated and to which versions. Use a table format in the PR body.
          PROMPT_EOF

          # Append extra prompt if provided
          if [ -n "$EXTRA" ]; then
            cat <<EXTRA_EOF >> /tmp/prompt.txt

          ## Additional instructions

          $EXTRA
          EXTRA_EOF
          fi

          # Set multi-line output
          {
            echo "content<<EOF"
            cat /tmp/prompt.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Pi agent
        uses: shaftoe/pi-coding-agent-action@v2
        with:
          github_token: "${{ secrets.github_token || secrets.GITHUB_TOKEN }}"
          provider: "${{ inputs.provider }}"
          model: "${{ inputs.model }}"
          token: "${{ secrets.token }}"
          thinking_level: "${{ inputs.thinking_level }}"
          prompt: "${{ steps.prompt.outputs.content }}"
          base_url: "${{ inputs.base-url || '' }}"
