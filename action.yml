name: "pi GitHub Action"
description: "Run the pi coding agent (pi.dev) in GitHub Actions workflows"
branding:
  icon: "terminal"
  color: "purple"

inputs:
  github_token:
    description: "GitHub token for API access"
    required: true

  provider:
    description: "LLM provider (e.g. anthropic, openai, google, ...)"
    required: false
    default: "anthropic"

  model:
    description: "Model to use (e.g. claude-sonnet-4-5, gpt-4o, gemini-2.5-pro, ...)"
    required: false
    default: "claude-sonnet-4-5"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/pi'"
    required: false
    default: "/pi"

  prompt:
    description: "Custom system prompt override (optional)"
    required: false

  extra_tools:
    description: "Comma-separated list of extra pi tools to enable (on top of read,write,edit,bash)"
    required: false

  env_vars:
    description: "Custom environment variables to inject (one KEY=VALUE per line, e.g., 'ZAI_API_KEY=xxx\\nANTHROPIC_KEY=yyy')"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install pi coding agent
      shell: bash
      run: bun install -g @mariozechner/pi-coding-agent

    - name: Run pi action
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        MENTIONS: ${{ inputs.mentions }}
        CUSTOM_PROMPT: ${{ inputs.prompt }}
        EXTRA_TOOLS: ${{ inputs.extra_tools }}
        PI_ENV_VARS: ${{ inputs.env_vars }}
      run: |
        cd ${{ github.action_path }}
        bun dist/index.js
